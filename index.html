<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fast Video Reverser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-6 text-center bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            Fast Video Reverser
        </h1>
        <div id="dropzone" class="border-2 border-dashed border-gray-600 rounded-lg p-10 text-center hover:border-blue-500 transition-colors cursor-pointer mb-6">
            <p class="text-gray-400">Drag & Drop or Click to Select Video</p>
            <input type="file" id="fileInput" class="hidden" accept="video/*">
        </div>
        <div id="status" class="hidden mb-4 p-3 bg-gray-700 rounded text-sm text-center"></div>
        <div class="flex flex-col gap-3">
            <button id="reverseBtn" disabled class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95">
                Reverse Video Locally
            </button>
            <button id="uploadBtn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95">
                Upload to Firebase
            </button>
        </div>
        <video id="outputVideo" class="mt-6 w-full rounded-lg hidden" controls></video>
    </div>
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const reverseBtn = document.getElementById('reverseBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const outputVideo = document.getElementById('outputVideo');
        let selectedFile = null;
        let processedBlob = null;
        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                status.innerText = `Selected: ${selectedFile.name}`;
                status.classList.remove('hidden');
                reverseBtn.disabled = false;
            }
        };
        reverseBtn.onclick = async () => {
            if (!selectedFile) return;
            reverseBtn.disabled = true;
            status.innerText = "Processing... (Stays in browser!)";
            if (!ffmpeg.isLoaded()) await ffmpeg.load();
            const { name } = selectedFile;
            ffmpeg.FS('writeFile', name, await fetchFile(selectedFile));
            await ffmpeg.run('-i', name, '-vf', 'reverse', '-af', 'areverse', '-preset', 'ultrafast', 'output.mp4');
            const data = ffmpeg.FS('readFile', 'output.mp4');
            processedBlob = new Blob([data.buffer], { type: 'video/mp4' });
            outputVideo.src = URL.createObjectURL(processedBlob);
            outputVideo.classList.remove('hidden');
            status.innerText = "Done! Video reversed.";
            uploadBtn.classList.remove('hidden');
            reverseBtn.disabled = false;
        };
        uploadBtn.onclick = async () => {
            if (!processedBlob) return;
            status.innerText = "Uploading to Firebase...";
            const storageRef = storage.ref().child(`reversed/${Date.now()}.mp4`);
            try {
                const snapshot = await storageRef.put(processedBlob);
                const url = await snapshot.ref.getDownloadURL();
                status.innerHTML = `Uploaded! <a href="${url}" target="_blank" class="text-blue-400 underline">View</a>`;
            } catch (e) {
                status.innerText = "Upload failed. Check Firebase config/rules.";
            }
        };
    </script>
</body>
</html>
